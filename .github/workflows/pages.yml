name: Deploy dashboard

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The per-address lookup shards are too large to keep in git history,
      # so each dataset snapshot is published as a `data-<height>` release.
      - name: Fetch lookup shards from the latest data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p web/data
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName \
                --jq '[.[] | select(.tagName | startswith("data-"))][0].tagName // empty')
          if [ -n "$tag" ]; then
            echo "Using dataset release $tag"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'lookup.tar.gz' --dir "$RUNNER_TEMP"
            tar -xzf "$RUNNER_TEMP/lookup.tar.gz" -C web/data
            echo "shards: $(ls web/data/lookup | wc -l)"
          else
            echo "No data release found; deploying without lookup shards"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
